<div class="bg-white p-4 rounded shadow-lg">
    <h2 class="text-xl font-bold mb-2">Customer {{ customer.customer_id }}</h2>

    <div class="grid grid-cols-2 gap-4">
        <div>
            <p><strong>Churn Probability:</strong> {{ customer.churn_prob }}</p>
            <p><strong>CLTV:</strong> {{ customer.cltv }}</p>
        </div>
        <div>
            <p><strong>Uplift:</strong> {{ customer.uplift }}</p>
            <p><strong>Recommended Action:</strong> {{ customer.action }}</p>
        </div>
    </div>

    {% if customer.reason %}
    <div class="mt-3 text-gray-700">
        <strong>Reason:</strong> {{ customer.reason }}
    </div>
    {% endif %}
</div>
